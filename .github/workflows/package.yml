name: Publish Wireview package
on:
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WIREVIEW_PACKAGE_DIR: /tmp/wireview-package
      npm_config_cache: /tmp/wireview-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@x4bnet'
      - run: npm ci --no-fund --no-audit --no-progress
      - run: npm test
      - run: npm run build -- --outDir '${{ runner.temp }}/wireview-standalone'
      - run: npm run build:lib
      - run: npm run check:package
        env:
          GITHUB_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          GITHUB_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
      - run: npm pack "$WIREVIEW_PACKAGE_DIR" --pack-destination '${{ runner.temp }}' --dry-run
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        run: npm publish "$WIREVIEW_PACKAGE_DIR" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
